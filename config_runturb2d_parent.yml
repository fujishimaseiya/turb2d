grid_param:
  grid_file: basin_l16_w8_dx100m.npy 
  flume_length: 
  flume_width:
  spacing: 100
  slope_outside: 
  slope_inside: 
  slope_basin: 
  slope_basin_break: 
  canyon_basin_break: 
  canyon_center: 
  canyon_half_width: 
  canyon: 
  noise: 

inlet_condition:
  inlet_edge:
  inlet_width: 1000.
  inlet_length: 
  h_ini: 30.0
  C_ini: 
        - 0.0025
        - 0.0025
        - 0.0025
        - 0.0025
  U_ini: 5.0

boundary_condition:
  top_edge: fixed_value
  bottom_edge: fixed_gradient
  left_edge: fixed_gradient
  right_edge: fixed_gradient

model_param:
  h_init: 0.0
  Ch_w: 10.0e-10
  h_w: 0.001
  alpha: 0.08
  Cf: 0.004
  g: 9.81
  R: 1.65
  Ds: 
    - 1.5e-4 # fine sand
    - 1.0e-4 # very fine sand
    - 2.0e-5 # silt
    - 3.0e-6 # clay
  lambda_p: 0.4
  r0: 2.0
  nu: 1.010e-6
  kappa: 0.05
  nu_a: 0.75
  implicit_num: 500
  implicit_threshold: 1.0e-12
  C_init: 0.0
  gamma: 0.35
  la: 0.003
  water_entrainment: True
  water_detrainment: True
  detrainment_coef: 1.0
  suspension: True
  sed_entrainment_func: GP1991exp
  no_erosion: False
  bedload_transport: False
  model: 4eq
  salt: False
  alpha_4eq: 0.6
  karman: 0.4
  p: 1.0
  flow_type: continuous
  one_way_nesting: True
  two_way_nesting: False